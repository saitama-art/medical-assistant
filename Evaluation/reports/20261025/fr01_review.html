function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  data.forEach(s => {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${s.id}：${s.question}</h2>`;
    const tbl = document.createElement('table');
    tbl.innerHTML = '<tr><th style="width:36px">#</th><th>医学陈述句</th><th>候选证据（AI 初筛）</th><th style="width:190px">判定</th></tr>';
    s.rows.forEach(r => {
      const key = s.id + '-' + r.n;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.n}</td><td>${r.sentence}</td><td class="ev">${r.evidence}</td>
        <td class="opts">
          <label><input type="radio" name="${key}" value="yes" ${marks[key]==='yes'?'checked':''}>✅支持</label>
          <label><input type="radio" name="${key}" value="no" ${marks[key]==='no'?'checked':''}>❌不支持</label>
          <label><input type="radio" name="${key}" value="na" ${marks[key]==='na'?'checked':''}>➖非医学句</label>
        </td>`;
      tbl.appendChild(tr);
    });
    sec.appendChild(tbl);
    root.appendChild(sec);
  });
  root.querySelectorAll('input[type=radio]').forEach(el => {
    el.addEventListener('change', e => {
      marks[e.target.name] = e.target.value;
      save(); stats();
    });
  });
  stats();
}

function stats() {
  let yes=0, no=0, na=0, total=0;
  data.forEach(s => s.rows.forEach(r => {
    total++;
    const v = marks[s.id + '-' + r.n];
    if (v==='yes') yes++; else if (v==='no') no++; else if (v==='na') na++;
  }));
  const judged = yes+no;
  const rate = judged ? (100*yes/judged).toFixed(1) : '—';
  const pass = judged && (yes/judged) >= 0.85;
  document.getElementById('stats').innerHTML =
    `已判定 ${yes+no+na}/${total}　✅ ${yes}　❌ ${no}　➖ ${na}　` +
    `<b>支持率 ${rate}%</b>　` +
    (judged ? (pass ? '<span class="pass">≥0.85，FR-01 通过</span>' : '<span class="fail">未达 0.85</span>') : '');
}

function summaryText() {
  let yes=0,no=0,na=0; const bad=[];
  data.forEach(s => s.rows.forEach(r => {
    const v = marks[s.id+'-'+r.n];
    if (v==='yes') yes++; else if (v==='no') { no++; bad.push(`${s.id}#${r.n} ${r.sentence}`); } else if (v==='na') na++;
  }));
  const judged = yes+no;
  const rate = judged ? (100*yes/judged).toFixed(1) : '—';
  return `FR-01 人工抽查结果（本人终审）\n支持 ${yes} / 不支持 ${no} / 非医学句 ${na}\n支持率 ${rate}%（通过线 ≥85%）\n不支持句：\n${bad.join('\n') || '（无）'}`;
}

document.getElementById('allYes').onclick = () => {
  data.forEach(s => s.rows.forEach(r => { marks[s.id+'-'+r.n]='yes'; }));
  save(); render();
};
document.getElementById('clearAll').onclick = () => {
  if (!confirm('清空全部判定？')) return;
  marks = {}; save(); render();
};
document.getElementById('copyBtn').onclick = async () => {
  const text = summaryText();
  document.getElementById('out').value = text;
  try { await navigator.clipboard.writeText(text); alert('结果已复制，可直接粘贴给 Claude'); }
  catch (e) { alert('已生成在下方文本框，请手动复制'); }
};
render();
</script></body></html>
